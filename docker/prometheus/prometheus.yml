
global:
  scrape_interval: 15s
  evaluation_interval: 15s


scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets: ["fastapi:8000"]
    metrics_path: "/59f5e3d2-8d9d-4b74-a1d1-6d6a5b4c2f8e"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: "/metrics"
    
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
